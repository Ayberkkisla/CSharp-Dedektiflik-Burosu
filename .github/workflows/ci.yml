name: CI

on:
  push:
  pull_request:

jobs:
  dotnet-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Soruları dotnet ile doğrula
        run: python scripts/validate_questions.py

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Prettier kontrolü
        run: npx --yes prettier --check "**/*.{html,css,md,yml,yaml}" "app.js" "sw.js" "sw-register.js" "firebase-config.js"
