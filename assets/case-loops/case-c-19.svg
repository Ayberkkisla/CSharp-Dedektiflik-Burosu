<svg xmlns="http://www.w3.org/2000/svg" width="480" height="210" viewBox="0 0 480 210" role="img" aria-labelledby="title desc">
 <title id="title">Son delil iskelesi</title><desc id="desc">Son düğüm 30 çıkarılır. Önce 20 düğümünün next bağlantısı NULL olur, sonra 30 serbest bırakılır.</desc>
 <style>
  text{font-family:Consolas,monospace;fill:#ecdbb5}.link{fill:none;stroke:#89b8c7;stroke-width:3}.back{stroke:#bf95d7}.old{animation:detach 7s infinite}.target{animation:release 7s infinite}.new{animation:connect 7s infinite}
  @keyframes detach{0%,30%{opacity:1}46%,88%{opacity:0}100%{opacity:1}}@keyframes release{0%,48%{opacity:1}65%,88%{opacity:0}100%{opacity:1}}@keyframes connect{0%,30%{opacity:0}46%,88%{opacity:1}100%{opacity:0}}@media(prefers-reduced-motion:reduce){.old,.target,.new{animation:none}.old,.target{opacity:0}.new{opacity:1}}
 </style>
 <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="context-stroke"/></marker></defs>
 <rect width="480" height="210" rx="16" fill="#191e24"/><text x="24" y="29" font-size="11" letter-spacing="2">BELLEK RIHTIMI / SON DELİL İSKELESİ</text>
 <g marker-end="url(#arrow)"><path class="link" d="M145 95H195"/><path class="link back" d="M195 126H145"/><path class="link old" d="M285 95H335"/><path class="link new" d="M285 95H315"/></g>
 <g class="new"><text x="293" y="79" font-size="11">NULL</text></g>
 <g fill="#29343d" stroke="#c3ab76"><rect x="55" y="83" width="90" height="54" rx="9"/><rect x="195" y="83" width="90" height="54" rx="9"/></g>
 <text x="89" y="118" font-size="25">10</text><text x="229" y="118" font-size="25">20</text>
 <g class="target"><rect x="335" y="83" width="90" height="54" rx="9" fill="#3a2930" stroke="#d69c8f"/><text x="369" y="118" font-size="25">30</text><path class="link back" d="M335 126H285" marker-end="url(#arrow)"/><text x="355" y="68" font-size="11">temp / son</text></g>
 <text x="23" y="70" font-size="10">NULL ← prev</text><path d="M0 170H480" stroke="#5d533e"/><text x="24" y="194" font-size="11">temp.prev.next = NULL → free(temp)</text>
</svg>
