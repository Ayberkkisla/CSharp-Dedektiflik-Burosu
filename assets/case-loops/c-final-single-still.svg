<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210"><style>
.arrival{animation:arrive 6s ease-in-out infinite}.join{animation:join 6s infinite}.trace{stroke-dasharray:6 6;animation:flow 1.5s linear infinite}.join.trace{animation:join 6s infinite,flow 1.5s linear infinite}.before{animation:before 6s infinite}.after{animation:join 6s infinite}
@keyframes arrive{0%,12%,100%{opacity:0;transform:translate(65px,-35px)}35%,85%{opacity:1;transform:translate(0,0)}}@keyframes join{0%,30%,100%{opacity:0}45%,85%{opacity:1}}@keyframes before{0%,25%,100%{opacity:1}40%,85%{opacity:0}}@keyframes flow{to{stroke-dashoffset:-24}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.arrival,.join,.after{opacity:1}.before{opacity:0}}
.arrival,.join,.after{animation:none!important;opacity:1;transform:none}.before{animation:none!important;opacity:0}.trace{animation:none!important}</style><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#461c2b"/><stop offset="1" stop-color="#19151e"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 10 5-10 5z" fill="#f2b7c7"/></marker></defs><rect width="480" height="210" fill="url(#bg)"/><path d="M0 174H480" stroke="#a7657866"/><g font-family="monospace" font-size="10" fill="#e6b5c3"><text x="20" y="25">FİNAL DOSYASI</text></g><text x="460" y="25" fill="#eea5b8" font-size="10" text-anchor="end" font-family="monospace">TEK YÖNLÜ · 10 SORU</text><g class="" transform="translate(194 78)"><rect width="68" height="48" rx="9" fill="#52303e" stroke="#df9bac"/><text x="34" y="32" text-anchor="middle" font-family="monospace" font-size="22" fill="#ffe4eb">10</text></g><g class="" transform="translate(324 78)"><rect width="68" height="48" rx="9" fill="#52303e" stroke="#df9bac"/><text x="34" y="32" text-anchor="middle" font-family="monospace" font-size="22" fill="#ffe4eb">20</text></g><path class="trace" d="M264 102H314" fill="none" stroke="#f2b7c7" stroke-width="2.5" marker-end="url(#arrow)"/><path class="" d="M394 102H431" fill="none" stroke="#f2b7c7" stroke-width="2.5" marker-end="url(#arrow)"/><text x="434" y="106" font-size="10" font-family="monospace" fill="#d7a4b2">NULL</text><g class="arrival"><g class="" transform="translate(64 78)"><rect width="68" height="48" rx="9" fill="#52303e" stroke="#df9bac"/><text x="34" y="32" text-anchor="middle" font-family="monospace" font-size="22" fill="#ffe4eb">7</text></g></g><path class="join trace" d="M134 102H184" fill="none" stroke="#f2b7c7" stroke-width="2.5" marker-end="url(#arrow)"/><g fill="#ffd3df" font-family="monospace" font-size="11"><text x="194" y="63" class="before">head ↓</text><text x="64" y="63" class="after">head ↓</