[build]
  command = "npm run build"
  publish = "."

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/firebase-config.js"
  [headers.values]
    Cache-Control = "no-store"

# C# kod dogrulama sunucusu (Render).
# Oyunun goreli /api/check ve /api/health cagrilari buradan gecirilir;
# boylece tarayicida CORS ayari gerekmez.
[[redirects]]
  from = "/api/*"
  to = "https://dedektif-api.onrender.com/api/:splat"
  status = 200

# Compatibility routes for removed legacy pages.
